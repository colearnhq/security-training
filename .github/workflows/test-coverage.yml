name: Test and Coverage

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - '*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  COVERAGE_THRESHOLD: "90"

jobs:
  jest:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: npm run test -- --coverage --coverageReporters=json-summary --coverageReporters=text-summary

      - name: Build coverage report
        id: coverage
        if: always()
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            bash .github/scripts/coverage_report.sh
            grep -v '^<!-- coverage-report -->' coverage-report/summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No coverage report was generated"
          fi

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage/
            coverage-report/
          if-no-files-found: ignore
          retention-days: 30

      - name: Comment coverage on pull request
        if: always() && steps.coverage.outputs.total != '' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          marker='<!-- coverage-report -->'
          api="repos/${GITHUB_REPOSITORY}"
          comment_id="$(gh api "${api}/issues/${PR_NUMBER}/comments" --paginate \
            --jq ".[] | select(.body | startswith(\"${marker}\")) | .id" | head -n 1)"
          if [ -n "${comment_id}" ]; then
            gh api --method PATCH "${api}/issues/comments/${comment_id}" -F body=@coverage-report/summary.md
          else
            gh api --method POST "${api}/issues/${PR_NUMBER}/comments" -F body=@coverage-report/summary.md
          fi

      - name: Enforce coverage threshold
        if: steps.coverage.outputs.total != ''
        run: |
          if [ "$(cat coverage-report/status.txt)" != "passing" ]; then
            echo "::error::Coverage $(cat coverage-report/total.txt)% is below the ${COVERAGE_THRESHOLD}% threshold"
            exit 1
          fi
